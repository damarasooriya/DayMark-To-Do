<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131a">
<title>Daymark — Personal Productivity</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#181d27;--panel2:#202735;--text:#edf1f7;--muted:#9aa5b5;--line:#2b3443;--accent:#8b9cff;--accent2:#b3bdff;--good:#49c995;--bad:#ff7b85;--warn:#f4bd62;--shadow:0 18px 50px #0003}
[data-theme="light"]{color-scheme:light;--bg:#f4f6fa;--panel:#fff;--panel2:#eef1f7;--text:#202637;--muted:#6f7889;--line:#e1e5ed;--accent:#596fe6;--accent2:#4057d5;--good:#159b6b;--bad:#d94e5c;--warn:#b87916;--shadow:0 16px 40px #26314a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit}button{cursor:pointer} .app{max-width:1440px;margin:auto;padding:0 28px 48px}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);z-index:10}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:-.5px;white-space:nowrap}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900}
.nav{display:flex;gap:5px;align-items:center;overflow:auto}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:10px;white-space:nowrap;font-size:13px;font-weight:650;transition:.2s}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}
.top-actions{display:flex;gap:8px;align-items:center}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 12px;transition:.2s}.iconbtn:hover,.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}.btn.small{padding:7px 10px;font-size:12px}
main{padding-top:30px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--accent2);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.pagehead h1{font-size:clamp(26px,4vw,36px);line-height:1.15;letter-spacing:-1.2px;margin:6px 0}.sub{color:var(--muted);margin:0}.dateinput,.field{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%;outline:none}.dateinput:focus,.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow);min-width:0}.stat-label{color:var(--muted);font-size:12px;font-weight:650}.stat-value{font-size:29px;font-weight:800;letter-spacing:-1px;margin:7px 0 2px}.stat-note{font-size:12px;color:var(--muted)}.stat-icon{float:right;width:34px;height:34px;border-radius:11px;background:var(--panel2);display:grid;place-items:center}
.contentgrid{grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);align-items:start}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.sectionhead h2{font-size:17px;margin:0;letter-spacing:-.3px}.muted{color:var(--muted)}.tasklist{display:grid;gap:9px}.task{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--panel);transition:.2s}.task:hover{border-color:color-mix(in srgb,var(--accent) 65%,var(--line));transform:translateY(-1px)}.check{width:21px;height:21px;accent-color:var(--accent);flex:none;cursor:pointer}.taskmain{min-width:0;flex:1}.taskname{font-weight:700;overflow-wrap:anywhere}.task.done .taskname{text-decoration:line-through;color:var(--muted)}.taskmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}.pill{font-size:10px;padding:3px 7px;border-radius:20px;background:var(--panel2);color:var(--muted);font-weight:700}.pill.high{color:var(--bad)}.pill.medium{color:var(--warn)}.pill.low{color:var(--good)}.taskactions{display:flex;gap:5px}.taskactions button{border:0;background:transparent;color:var(--muted);padding:5px;border-radius:7px}.taskactions button:hover{background:var(--panel2);color:var(--text)}
.progress{height:8px;background:var(--panel2);border-radius:20px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .3s}.progressline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:12px 0 7px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.daycell{background:var(--panel2);border-radius:10px;padding:9px 3px;text-align:center;min-width:0}.daycell .dow{font-size:10px;color:var(--muted)}.daycell .dot{width:7px;height:7px;border-radius:50%;margin:7px auto 0;background:var(--line)}.daycell.success .dot{background:var(--good)}.daycell.partial .dot{background:var(--warn)}.daycell.today{outline:1px solid var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.empty strong{display:block;color:var(--text);margin-bottom:5px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fieldgroup{display:grid;gap:6px;margin-bottom:13px}.fieldgroup label{font-size:12px;color:var(--muted);font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar .field{width:auto;min-width:150px}.listtable{width:100%;border-collapse:collapse}.listtable th,.listtable td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}.listtable th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px}.listtable tr:last-child td{border-bottom:0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.calhead{text-align:center;color:var(--muted);font-size:11px;padding:8px}.calday{min-height:86px;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:8px;cursor:pointer;transition:.2s}.calday:hover{border-color:var(--accent)}.calday.dim{opacity:.35}.calday.selected{outline:2px solid var(--accent)}.calday.today{background:var(--panel2)}.calnum{font-size:12px;font-weight:750}.calmark{font-size:10px;color:var(--muted);margin-top:9px}.caldot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;background:var(--good)}
.chart{height:180px;display:flex;align-items:end;gap:10px;padding:18px 4px 0;border-bottom:1px solid var(--line)}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px;min-width:0}.bar{width:min(34px,75%);min-height:3px;background:var(--accent);border-radius:7px 7px 2px 2px;transition:height .3s}.barlabel{font-size:10px;color:var(--muted)}.barval{font-size:10px;color:var(--muted)}
.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modalback.show{display:flex}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 25px 80px #0006}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:19px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:11px;font-size:13px;font-weight:700;transition:.25s;z-index:50;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.notice{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--panel));padding:13px;border-radius:12px;color:var(--muted);font-size:12px}.notice strong{color:var(--text)}.hidden{display:none!important}.footer{margin-top:36px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:900px){.app{padding:0 18px 35px}.topbar{height:auto;min-height:68px;flex-wrap:wrap;padding:12px 0}.nav{order:3;width:100%;padding-bottom:2px}.top-actions{margin-left:auto}.contentgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.app{padding:0 13px 28px}.pagehead{align-items:flex-start;flex-direction:column}.stats{gap:9px}.card{padding:15px}.stat-value{font-size:24px}.formrow{grid-template-columns:1fr}.calday{min-height:62px;padding:6px}.calmark{font-size:9px}.toolbar .field{width:100%}.task{padding:10px}.taskactions{gap:0}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><span class="brandmark">D</span> daymark</div>
  <nav class="nav" aria-label="Main navigation">
    <button class="active" data-page="dashboard">Overview</button><button data-page="tasks">My Tasks</button><button data-page="planner">Plan Day</button><button data-page="calendar">Calendar</button><button data-page="analytics">Analytics</button>
  </nav>
  <div class="top-actions"><button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☼</button><button class="iconbtn" id="settingsBtn" title="Settings">⚙</button></div>
</header>
<main id="main"></main>
<div class="footer">DAYMARK · Your plans, your pace. Data stays in this browser.</div>
</div>
<div class="modalback" id="modalback"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<script>
(()=>{
const KEY='daymark_data_v1', THEME='daymark_theme_v1';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const shift=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=(s,opts={weekday:'short',month:'short',day:'numeric'})=>new Date(s+'T12:00:00').toLocaleDateString(undefined,opts);
const uid=()=>Math.random().toString(36).slice(2,10);
const fresh=()=>({version:1,tasks:[],days:{},createdAt:new Date().toISOString()});
let data=load(),page='dashboard',selectedDate=today(),calMonth=new Date(today()+'T12:00:00'),toastTimer;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===1&&Array.isArray(x.tasks)&&x.days&&typeof x.days==='object')return x}catch(e){}return fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function day(date){return data.days[date]||null}
function tasksFor(date){return day(date)?.tasks||[]}
function pct(date){const a=tasksFor(date);return a.length?Math.round(a.filter(t=>t.done).length/a.length*100):0}
function successful(date){const a=tasksFor(date);return a.length>0&&a.filter(t=>t.done).length>=Math.ceil(a.length*.7)}
function streak(){let n=0,d=today();if(!day(d)||!tasksFor(d).length||!successful(d))d=shift(d,-1);while(n<3650&&day(d)&&successful(d)){n++;d=shift(d,-1)}return n}
function weekDates(){return Array.from({length:7},(_,i)=>shift(today(),i-6))}
function ensureDay(date){if(!data.days[date])data.days[date]={tasks:[],updatedAt:new Date().toISOString()};return data.days[date]}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function header(kicker,title,sub,extra=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${extra}</div>`}
function stat(label,value,note,icon){return `<div class="card"><span class="stat-icon">${icon}</span><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function taskHTML(t,date,idx){return `<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" ${t.done?'checked':''} data-action="toggle" data-date="${date}" data-id="${t.id}" aria-label="Complete task"><div class="taskmain"><div class="taskname">${esc(t.name)}</div><div class="taskmeta"><span class="pill">${esc(t.category||'General')}</span><span class="pill ${esc(t.priority||'medium')}">${esc(t.priority||'medium')} priority</span>${t.note?`<span class="pill">${esc(t.note)}</span>`:''}</div></div><div class="taskactions"><button title="Edit task" data-action="edit-day-task" data-date="${date}" data-id="${t.id}">✎</button><button title="Remove from this day" data-action="remove-day-task" data-date="${date}" data-id="${t.id}">×</button></div></div>`}
function empty(msg,detail){return `<div class="empty"><strong>${msg}</strong>${detail}</div>`}
function renderDashboard(){
 const d=today(),a=tasksFor(d),done=a.filter(t=>t.done).length,p=a.length?pct(d):0,week=weekDates();
 return header('YOUR SPACE', 'Make today count.',fmt(d,{weekday:'long',month:'long',day:'numeric',year:'numeric'}),`<button class="btn primary" data-action="plan-tomorrow">＋ Plan tomorrow</button>`)+
 `<div class="grid stats">${stat("Today's progress",a.length?p+'%':'—',`${done} of ${a.length} tasks completed`,'◷')}${stat('Current streak',streak()+' days','70% or more completed on a planned day','🔥')}${stat('Tasks in your library',data.tasks.length,'Reusable tasks ready to plan','▤')}${stat('This week',week.reduce((n,x)=>n+(day(x)?tasksFor(x).filter(t=>t.done).length:0),0),'Tasks completed in the last 7 days','✓')}</div>
 <div class="grid contentgrid"><section class="card"><div class="sectionhead"><h2>Today's tasks</h2><button class="btn small" data-action="go-planner">Manage day →</button></div>${a.length?`<div class="progressline"><span>Daily completion</span><strong>${p}%</strong></div><div class="progress"><span style="width:${p}%"></span></div><div class="tasklist" style="margin-top:15px">${a.map((t,i)=>taskHTML(t,d,i)).join('')}</div>`:empty('Nothing planned for today','Choose tasks from your library to create today\'s list.') }<div style="margin-top:15px"><button class="btn ${a.length?'ghost':'primary'}" data-action="go-planner">＋ ${a.length?'Add or change tasks':'Build today\'s list'}</button></div></section>
 <aside class="grid"><section class="card"><div class="sectionhead"><h2>Last 7 days</h2><span class="muted" style="font-size:11px">Completion</span></div><div class="week">${week.map(x=>`<div class="daycell ${x===d?'today':''} ${day(x)&&successful(x)?'success':day(x)&&pct(x)>0?'partial':''}"><div class="dow">${fmt(x,{weekday:'short'})}</div><strong>${new Date(x+'T12:00:00').getDate()}</strong><div class="dot"></div></div>`).join('')}</div><div class="progressline"><span>Weekly task completion</span><strong>${week.reduce((n,x)=>n+tasksFor(x).filter(t=>t.done).length,0)} done</strong></div></section>
 <section class="card"><div class="sectionhead"><h2>Quick actions</h2></div><div class="grid"><button class="btn" data-action="go-tasks">＋ Add a reusable task</button><button class="btn" data-action="go-calendar">▦ Open calendar</button><button class="btn" data-action="go-analytics">▥ View analytics</button></div></section></aside></div>`;
}
function renderTasks(){
 const cats=[...new Set(data.tasks.map(t=>t.category||'General'))];
 return header('TASK LIBRARY','Your reusable tasks','Add the activities you commonly do. Select them when planning a day.',`<button class="btn primary" data-action="add-library">＋ New task</button>`)+
 `<section class="card"><div class="sectionhead"><h2>Task library <span class="muted">(${data.tasks.length})</span></h2><div class="toolbar"><input class="field" id="taskSearch" placeholder="Search tasks…" style="max-width:220px"><select class="field" id="catFilter"><option value="">All categories</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div><div id="libraryList" class="tasklist">${libraryHTML(data.tasks)}</div></section>
 <p class="muted" style="font-size:12px;margin-top:12px">A library task is a reusable template. Editing it here does not change tasks already added to previous days.</p>`;
}
function libraryHTML(arr){return arr.length?arr.map(t=>`<div class="task"><div class="taskmain"><div class="taskname">${esc(t.name)}</div><div class="taskmeta"><span class="pill">${esc(t.category||'General')}</span><span class="pill ${esc(t.priority||'medium')}">${esc(t.priority||'medium')} priority</span></div></div><div class="taskactions"><button data-action="edit-library" data-id="${t.id}" title="Edit">✎</button><button data-action="delete-library" data-id="${t.id}" title="Delete">×</button></div></div>`).join(''):empty('Your library is empty','Add a reusable task to get started.')}
function renderPlanner(){
 const d=selectedDate,a=tasksFor(d),isPast=d<today(),isFuture=d>today();
 const library=data.tasks;
 return header('DAILY PLANNING','Plan your day',`${fmt(d,{weekday:'long',month:'long',day:'numeric',year:'numeric'})} · Select reusable tasks or add a one-off task.`,`<input class="dateinput" type="date" id="plannerDate" value="${d}">`)+
 `<div class="grid contentgrid"><section class="card"><div class="sectionhead"><h2>${isPast?'Recorded tasks':isFuture?'Planned tasks':"Today's tasks"}</h2><span class="muted">${a.length} selected</span></div>${a.length?`<div class="progressline"><span>Completion</span><strong>${pct(d)}%</strong></div><div class="progress"><span style="width:${pct(d)}%"></span></div><div class="tasklist" style="margin-top:14px">${a.map((t,i)=>taskHTML(t,d,i)).join('')}</div>`:empty('No tasks selected','Choose tasks from your library on the right, or create a one-off task.') }<div class="toolbar" style="margin-top:15px"><button class="btn" data-action="add-oneoff">＋ One-off task</button><button class="btn" data-action="clear-day">Clear this day</button></div></section>
 <aside class="card"><div class="sectionhead"><h2>Choose from library</h2><span class="muted">${library.length} available</span></div><input class="field" id="plannerSearch" placeholder="Find a task…" style="margin-bottom:12px">${library.length?`<div id="plannerLibrary" class="tasklist">${plannerLibraryHTML(library,d)}</div>`:empty('No reusable tasks yet','Create your first task in My Tasks.') }<div style="margin-top:13px"><button class="btn small" data-action="go-tasks">Manage task library →</button></div></aside></div>`;
}
function plannerLibraryHTML(arr,d){const chosen=tasksFor(d).map(t=>t.sourceId).filter(Boolean);return arr.map(t=>`<div class="task"><div class="taskmain"><div class="taskname">${esc(t.name)}</div><div class="taskmeta"><span class="pill">${esc(t.category)}</span></div></div><button class="btn small ${chosen.includes(t.id)?'':'primary'}" data-action="select-library" data-id="${t.id}" data-date="${d}" ${chosen.includes(t.id)?'disabled':''}>${chosen.includes(t.id)?'Added':'＋ Add'}</button></div>`).join('')}
function renderCalendar(){
 const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
 let cells='';for(let i=0;i<42;i++){let n,date,dim=false;if(i<start){n=prev-start+i+1;date=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`;dim=true}else if(i>=start+days){n=i-start-days+1;const dt=new Date(y,m+1,n);date=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;dim=true}else{n=i-start+1;date=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;}
 const a=tasksFor(date);cells+=`<div class="calday ${dim?'dim':''} ${date===selectedDate?'selected':''} ${date===today()?'today':''}" data-action="calendar-day" data-date="${date}"><div class="calnum">${n}</div>${a.length?`<div class="calmark"><span class="caldot" style="background:${successful(date)?'var(--good)':pct(date)>0?'var(--warn)':'var(--bad)'}"></span>${a.filter(t=>t.done).length}/${a.length} done</div>`:''}</div>`}
 return header('HISTORY','Calendar','Select any day to inspect its task list and completion history.',`<button class="btn" data-action="calendar-today">Today</button>`)+
 `<section class="card"><div class="sectionhead"><div class="toolbar"><button class="iconbtn" data-action="month-prev">‹</button><h2 style="margin:0">${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="iconbtn" data-action="month-next">›</button></div><span class="muted" style="font-size:12px">Select a date</span></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells}</div></section>
 <section class="card" style="margin-top:16px"><div class="sectionhead"><h2>${fmt(selectedDate,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2><span class="pill">${tasksFor(selectedDate).length?pct(selectedDate)+'% complete':'No plan'}</span></div>${tasksFor(selectedDate).length?`<div class="tasklist">${tasksFor(selectedDate).map(t=>`<div class="task ${t.done?'done':''}"><span>${t.done?'✓':'○'}</span><div class="taskmain"><div class="taskname">${esc(t.name)}</div><div class="taskmeta"><span class="pill">${esc(t.category)}</span></div></div><span class="pill">${t.done?'Completed':'Not completed'}</span></div>`).join('')}</div>`:empty('No tasks recorded','This date has no saved task list.') }<div style="margin-top:13px"><button class="btn small" data-action="open-selected-day">Open in planner →</button></div></section>`;
}
function renderAnalytics(){
 const dates=Array.from({length:7},(_,i)=>shift(today(),i-6)),month=Array.from({length:30},(_,i)=>shift(today(),i-29));
 const all=dates.flatMap(d=>tasksFor(d)),done=all.filter(t=>t.done).length,rate=all.length?Math.round(done/all.length*100):0;
 const totalDays=month.filter(d=>tasksFor(d).length).length,goodDays=month.filter(d=>successful(d)).length;
 const counts={};all.forEach(t=>{counts[t.name]=(counts[t.name]||{done:0,total:0});counts[t.name].total++;if(t.done)counts[t.name].done++});
 const top=Object.entries(counts).sort((a,b)=>b[1].total-a[1].total).slice(0,5);
 return header('INSIGHTS','Your progress','Understand your consistency and identify which tasks need attention.')+
 `<div class="grid stats">${stat('7-day completion',rate+'%',`${done} of ${all.length} planned tasks completed`,'▥')}${stat('Current streak',streak()+' days','Consecutive successful planned days','🔥')}${stat('Successful days',goodDays,'In the last 30 days','✓')}${stat('Planned days',totalDays,'Days with at least one task','▦')}</div>
 <div class="grid contentgrid"><section class="card"><div class="sectionhead"><h2>Daily completion · last 7 days</h2></div><div class="chart">${dates.map(d=>{const v=tasksFor(d).length?pct(d):0;return `<div class="barwrap"><span class="barval">${tasksFor(d).length?v+'%':'—'}</span><div class="bar" style="height:${Math.max(v,2)}%"></div><span class="barlabel">${fmt(d,{weekday:'short'})}</span></div>`}).join('')}</div><div class="progressline"><span>Overall task completion</span><strong>${rate}%</strong></div><div class="progress"><span style="width:${rate}%"></span></div></section>
 <aside class="card"><div class="sectionhead"><h2>30-day consistency</h2></div><div class="stat-value">${totalDays?Math.round(goodDays/totalDays*100):0}%</div><p class="muted" style="font-size:12px">Successful days out of days where you planned at least one task.</p><div class="progress"><span style="width:${totalDays?goodDays/totalDays*100:0}%"></span></div><p class="muted" style="font-size:11px;margin-top:12px">A successful day means at least 70% of that day's planned tasks were completed.</p></aside></div>
 <section class="card" style="margin-top:16px"><div class="sectionhead"><h2>Most frequently planned tasks</h2><span class="muted" style="font-size:11px">Last 7 days</span></div>${top.length?`<table class="listtable"><thead><tr><th>Task</th><th>Completed</th><th>Rate</th></tr></thead><tbody>${top.map(([name,x])=>`<tr><td>${esc(name)}</td><td>${x.done}/${x.total}</td><td>${Math.round(x.done/x.total*100)}%</td></tr>`).join('')}</tbody></table>`:empty('No analytics yet','Plan and complete tasks to build your history.')}</section>
 <p class="muted" style="font-size:11px;margin-top:12px">Analytics use saved daily records. Unplanned days are not counted as missed days.</p>`;
}
function renderSettings(){
 return header('PREFERENCES','Settings','Manage your appearance and protect your personal data.')+
 `<div class="grid contentgrid"><section class="card"><div class="sectionhead"><h2>Appearance</h2></div><p class="muted" style="font-size:13px">Choose the look that feels right. Your choice is remembered in this browser.</p><div class="toolbar"><button class="btn" data-action="theme-dark">☾ Dark mode</button><button class="btn" data-action="theme-light">☼ Light mode</button></div><div style="margin-top:24px"><h2 style="font-size:16px">Streak rule</h2><p class="muted" style="font-size:13px">A day counts toward your streak when you complete at least 70% of its planned tasks. At least one task must be planned. Incomplete tasks stay in that day's history; they are not automatically carried forward.</p></div></section>
 <section class="card"><div class="sectionhead"><h2>Backup & restore</h2></div><p class="muted" style="font-size:13px">Export a copy of your task library and daily history. Keep the JSON file somewhere safe.</p><div class="grid"><button class="btn primary" data-action="export">↓ Export backup</button><button class="btn" data-action="import">↑ Import backup</button></div><div class="notice" style="margin-top:15px"><strong>Important:</strong> Your data is stored only in this browser on this device. Clearing browser data may erase it. Export backups regularly. Importing a backup replaces the current Daymark data.</div></section></div>
 <section class="card" style="margin-top:16px"><div class="sectionhead"><h2>Data management</h2></div><p class="muted" style="font-size:13px">Permanently remove all tasks, daily records and preferences stored by this app.</p><button class="btn danger" data-action="reset">Reset all app data</button></section>`;
}
function render(){const main=document.getElementById('main');main.innerHTML=({dashboard:renderDashboard,tasks:renderTasks,planner:renderPlanner,calendar:renderCalendar,analytics:renderAnalytics,settings:renderSettings}[page]||renderDashboard)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function openModal(title,body,submitLabel='Save',onSave=null){const back=document.getElementById('modalback'),modal=document.getElementById('modal');modal.innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="iconbtn" data-action="close-modal">×</button></div>${body}<div class="toolbar" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" id="modalSave">${submitLabel}</button></div>`;back.classList.add('show');document.getElementById('modalSave').onclick=()=>{if(onSave&&onSave()===false)return;closeModal()}}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function taskForm(t={}){return `<div class="fieldgroup"><label>Task name *</label><input class="field" id="fName" maxlength="90" placeholder="e.g. Study ICT" value="${esc(t.name||'')}"></div><div class="formrow"><div class="fieldgroup"><label>Category</label><input class="field" id="fCategory" maxlength="30" placeholder="Study, Fitness…" value="${esc(t.category||'General')}"></div><div class="fieldgroup"><label>Priority</label><select class="field" id="fPriority"><option ${t.priority==='high'?'selected':''} value="high">High</option><option ${(!t.priority||t.priority==='medium')?'selected':''} value="medium">Medium</option><option ${t.priority==='low'?'selected':''} value="low">Low</option></select></div></div><div class="fieldgroup"><label>Short note (optional)</label><input class="field" id="fNote" maxlength="70" placeholder="e.g. Chapter 03" value="${esc(t.note||'')}"></div>`}
function readForm(){const name=document.getElementById('fName').value.trim();if(!name){toast('Please enter a task name.');return null}return {name,category:document.getElementById('fCategory').value.trim()||'General',priority:document.getElementById('fPriority').value,note:document.getElementById('fNote').value.trim()}}
function addLibrary(){openModal('Create reusable task',taskForm(), 'Add task',()=>{const v=readForm();if(!v)return false;data.tasks.push({id:uid(),...v,createdAt:new Date().toISOString()});save();render();toast('Task added to your library.');return true})}
function editLibrary(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;openModal('Edit reusable task',taskForm(t),'Save changes',()=>{const v=readForm();if(!v)return false;Object.assign(t,v);save();render();toast('Task updated.');return true})}
function addOneoff(date){openModal('Add one-off task',taskForm(),'Add to day',()=>{const v=readForm();if(!v)return false;ensureDay(date).tasks.push({id:uid(),...v,done:false,sourceId:null});save();render();toast('Task added to this day.');return true})}
function editDayTask(date,id){const t=tasksFor(date).find(x=>x.id===id);if(!t)return;openModal('Edit daily task',taskForm(t),'Save changes',()=>{const v=readForm();if(!v)return false;Object.assign(t,v);save();render();toast('Daily task updated.');return true})}
function selectLibrary(id,date){const src=data.tasks.find(t=>t.id===id);if(!src)return;const a=ensureDay(date).tasks;if(a.some(t=>t.sourceId===id)){toast('This task is already on that day.');return}a.push({id:uid(),sourceId:src.id,name:src.name,category:src.category,priority:src.priority,note:src.note,done:false});save();render();toast('Task added to your day.')}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`daymark-backup-${today()}.json`;a.click();URL.revokeObjectURL(url);toast('Backup exported.')}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x||x.version!==1||!Array.isArray(x.tasks)||!x.days||typeof x.days!=='object')throw Error();if(!confirm('Importing will replace all current Daymark data. Continue?'))return;data=x;save();render();toast('Backup restored.')}catch(e){toast('That file is not a valid Daymark backup.')}};reader.readAsText(file)}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,date=b.dataset.date;
 switch(a){
 case 'add-library':addLibrary();break;case 'edit-library':editLibrary(id);break;
 case 'delete-library':if(confirm('Delete this reusable task? Existing daily records will remain unchanged.')){data.tasks=data.tasks.filter(t=>t.id!==id);save();render();toast('Library task deleted.')}break;
 case 'select-library':selectLibrary(id,date);break;case 'add-oneoff':addOneoff(selectedDate);break;
 case 'edit-day-task':editDayTask(date,id);break;
 case 'remove-day-task':if(confirm('Remove this task from the selected day?')){const d=day(date);d.tasks=d.tasks.filter(t=>t.id!==id);save();render();}break;
 case 'toggle':break;
 case 'clear-day':if(confirm('Remove every task from this day? This cannot be undone unless you have a backup.')){if(day(selectedDate))data.days[selectedDate].tasks=[];save();render();}break;
 case 'go-planner':setPage('planner');break;case 'go-tasks':setPage('tasks');break;case 'go-calendar':setPage('calendar');break;case 'go-analytics':setPage('analytics');break;
 case 'plan-tomorrow':selectedDate=shift(today(),1);setPage('planner');break;
 case 'calendar-day':selectedDate=date;render();break;case 'calendar-today':calMonth=new Date();selectedDate=today();render();break;
 case 'month-prev':calMonth.setMonth(calMonth.getMonth()-1);render();break;case 'month-next':calMonth.setMonth(calMonth.getMonth()+1);render();break;
 case 'open-selected-day':setPage('planner');break;
 case 'theme-dark':setTheme('dark');break;case 'theme-light':setTheme('light');break;
 case 'export':exportData();break;case 'import':document.getElementById('importFile').click();break;
 case 'reset':if(confirm('This permanently deletes all Daymark tasks and history. Export a backup first if needed. Are you sure?')){data=fresh();save();render();toast('All app data has been reset.')}break;
 case 'close-modal':closeModal();break;
 }
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-action="toggle"]')){const {date,id}=e.target.dataset,t=tasksFor(date).find(x=>x.id===id);if(t){t.done=e.target.checked;save();render();}}
 if(e.target.id==='plannerDate'){selectedDate=e.target.value||today();render()}
 if(e.target.id==='importFile'&&e.target.files[0]){importData(e.target.files[0]);e.target.value=''}
 if(e.target.id==='catFilter'||e.target.id==='taskSearch'){filterLibrary()}
});
document.addEventListener('input',e=>{if(e.target.id==='taskSearch')filterLibrary();if(e.target.id==='plannerSearch'){const q=e.target.value.toLowerCase();const el=document.getElementById('plannerLibrary');if(el)el.innerHTML=plannerLibraryHTML(data.tasks.filter(t=>(t.name+' '+t.category).toLowerCase().includes(q)),selectedDate)}});
function filterLibrary(){const q=(document.getElementById('taskSearch')?.value||'').toLowerCase(),cat=document.getElementById('catFilter')?.value||'';const el=document.getElementById('libraryList');if(el)el.innerHTML=libraryHTML(data.tasks.filter(t=>(t.name+' '+t.category).toLowerCase().includes(q)&&(!cat||t.category===cat)))}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem(THEME,t);document.getElementById('themeBtn').textContent=t==='dark'?'☼':'☾'}
const savedTheme=localStorage.getItem(THEME)||'dark';setTheme(savedTheme);
document.getElementById('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
document.getElementById('settingsBtn').onclick=()=>setPage('settings');
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
render();
})();
</script>
</body>
</html>
